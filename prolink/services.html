<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: "Open Sans", sans-serif;
      font-optical-sizing: auto;
      font-weight: 400;
      font-style: normal;
      margin: 0;
    }
    .services-title{
      font-family: "Montserrat", Sans-serif;
      font-size: 46px;
      font-weight: 500;
      color: #0D1B2A;
      margin: 0 0 15px 0;
    }
    .services-list-section {
      padding: 60px;
      background-color: #EAEAEA;
    }
    .services-list-block {
      display: flex;
      flex-wrap: wrap;
      margin: 0 -10px;
    }
    .services-list-items {
      align-items: flex-start;
      width: calc(33.3% - 20px);
      overflow: hidden;
      border-radius: 9px;
      margin: 10px 10px;
      background-color: #fff;
      display: inline-flex;
      padding:30px 15px;
    }
    .services-list-title {
      margin: 0;
      font-size: 24px;
      font-weight: 500;
      color: #0D1B2A;
      padding-left: 17px;
    }
    .services-list-image img {
      width: 130px;
      height: 75px;
      object-fit: cover;
      border-radius: 9px;
    }
    .services-list-items:hover {
      background-color: #008F5D;
    }
    .services-list-items:hover .services-list-title {
      color: #fff;
    }
    @media(max-width:1200px) {
      .services-list-items {
        width: calc(50% - 20px);
      }
      .services-list-title {
        font-size: 20px;
      }
    }

    @media(max-width:767px) {
      .services-list-block {
        margin: 0 -10px;
      }
      .services-list-title {
        font-size: 14px;
      }
      .services-list-items {
        width: 100%;
      }
      .services-list-section {
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <section class="services-list-section">
    <h2 class="services-title">Services</h2>
    <div class="services-list-block">
      <div class="services-list-items">
        <div class="services-list-image">
          <img src="https://prolink.dev.vinove.com/wp-content/uploads/2025/10/services-image3.jpg"
            alt="services-list-image">
        </div>
        <h2 class="services-list-title">Procurement & Supply Chain</h2>
      </div>
      <div class="services-list-items">
        <div class="services-list-image">
          <img src="https://prolink.dev.vinove.com/wp-content/uploads/2025/10/services-image3.jpg"
            alt="services-list-image">
        </div>
        <h2 class="services-list-title">Mining, Energy & Resources</h2>
      </div>
      <div class="services-list-items">
        <div class="services-list-image">
          <img src="https://prolink.dev.vinove.com/wp-content/uploads/2025/10/services-image3.jpg"
            alt="services-list-image">
        </div>
        <h2 class="services-list-title">Agriculture & Agribusiness</h2>
      </div>
      <div class="services-list-items">
        <div class="services-list-image">
          <img src="https://prolink.dev.vinove.com/wp-content/uploads/2025/10/services-image3.jpg"
            alt="services-list-image">
        </div>
        <h2 class="services-list-title">Construction & Infrastructure</h2>
      </div>
      <div class="services-list-items">
        <div class="services-list-image">
          <img src="https://prolink.dev.vinove.com/wp-content/uploads/2025/10/services-image3.jpg"
            alt="services-list-image">
        </div>
        <h2 class="services-list-title">ICT & Software Solutions</h2>
      </div>
      <div class="services-list-items">
        <div class="services-list-image">
          <img src="https://prolink.dev.vinove.com/wp-content/uploads/2025/10/services-image3.jpg"
            alt="services-list-image">
        </div>
        <h2 class="services-list-title">Healthcare Solutions</h2>
      </div>
      <div class="services-list-items">
        <div class="services-list-image">
          <img src="https://prolink.dev.vinove.com/wp-content/uploads/2025/10/services-image3.jpg"
            alt="services-list-image">
        </div>
        <h2 class="services-list-title">Manpower & Recruitment</h2>
      </div>
    </div>
  </section>
</body>

</html>
