<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Open Sans", sans-serif;
      font-optical-sizing: auto;
      font-weight: 400;
      font-style: normal;
      margin: 0;
    }

    .career-title {
      font-family: "Montserrat", Sans-serif;
      font-size: 46px;
      font-weight: 500;
      color: #0D1B2A;
      margin: 0;
    }

    .career-description {
      font-size: 20px;
      color: #000000;
      margin: 20px 0 40px 0;
    }

    .career-section {
      padding: 86px 70px 70px 70px;
      background-color: #EAEAEA;
    }

    .roles-button {
      font-size: 18px;
      text-transform: none;
      border-radius: 40px 40px 40px 40px;
      padding: 7px 20px;
      background-color: #008F5D;
      color: #fff;
      display: inline-flex;
      text-decoration: none;
    }

    .orange-button-sm {
      background-color: #ff7a00;
      text-transform: capitalize;
      color: #fff;
      border-radius: 9px;
      font-size: 15px;
      padding: 8px 30px;
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }

    .career-list-items {
      padding: 38px 43px;
      background-color: #fff;
      border-radius: 10px;
      margin: 17px 0;
    }

    .career-list-option {
      justify-content: space-between;
      display: flex;
    }

    .career-list-title {
      font-family: "Montserrat", Sans-serif;
      font-size: 24px;
      font-weight: 500;
      color: #0D1B2A;
      margin: 25px 0 10px;
    }

    .career-list-description {
      font-size: 18px;
      font-weight: 400;
      color: #868686;
      padding-bottom: 25px;
      margin: 0;
    }

    ul.career-list-row {
      padding: 0;
      list-style-type: none;
      display: flex;
      align-items: center;
      margin: 0;
    }

    .career-list-row li {
      display: inline-flex;
      padding-right: 40px;
      font-family: "Montserrat", Sans-serif;
      font-size: 16px;
      font-weight: 500;
      color: #0D1B2A;
    }

    .career-list-icon {
      padding-right: 10px;
    }

    .orange-button-sm svg {
      margin-left: 10px;
    }


    .popup {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
    }

    /* Popup box */
    .popup-content {
      background: #fff;
      padding: 15px 30px;
      border-radius: 10px;
      width: 500px;
      text-align: left;
      position: relative;
    }

    /* Close button */
    .popup-content .close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 22px;
      cursor: pointer;
    }

    .popup-content .contact-section {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .popup-content .contact-container {
      background: #f8fbff;
      border-radius: 10px;
      width: 100%;
      max-width: 450px;
      padding: 30px;
      border: 1px solid #D2D0D0;
    }

    .popup-content .contact-container h2 {
      text-align: center;
      font-size: 28px;
      color: #0b1c3f;
      margin: 0 0 25px;
    }

    .popup-content .contact-form label {
      display: block;
      margin-bottom: 6px;
      color: #0b1c3f;
      font-weight: 500;
    }

    .popup-content .contact-form input[type="text"],
    .popup-content .contact-form input[type="email"],
    .popup-content .contact-form input[type="tel"],
    .contact-form textarea {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 18px;
      border: 1px solid #cfd8dc;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .popup-content .contact-form input:focus,
    .popup-content .contact-form textarea:focus {
      border-color: #007bff;
    }

    .popup-content .contact-form textarea {
      resize: none;
      height: 100px;
    }

    .popup-content .recaptcha {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 20px;
    }

    .popup-content .send-btn {
      background-color: #ff7a00;
      text-transform: capitalize;
      color: #fff;
      border-radius: 9px;
      font-size: 15px;
      padding: 8px 30px;
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }

    @media(max-width:1200px) {}

    @media(max-width:767px) {}
  </style>
</head>

<body>
  <section class="career-section">
    <h2 class="career-title">Current Opportunities</h2>
    <p class="career-description">We’re always looking for talented professionals to join our growing team.</p>
    <div class="career-list-block">
      <div class="career-list-items">
        <div class="career-list-option">
          <a class="roles-button" role="button">
            Design
          </a>
          <a class="orange-button-sm" href="#" id="applyBtn">Apply
            <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 21 21" fill="none">
              <path
                d="M4.93176 17.3057L3.69434 16.0684L13.7002 6.0625H8.81266V4.3125H16.6877V12.1875H14.9377V7.29991L4.93176 17.3057Z"
                fill="white"></path>
            </svg>
          </a>
        </div>
        <h2 class="career-list-title">Senior Product Designer</h2>
        <p class="career-list-description">In a laoreet purus. Integer turpis quam, laoreet id orci nec, ultrices
          lacinia nunc. Aliquam erat vo</p>
        <ul class="career-list-row">
          <li class="career-list">
            <span class="career-list-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path
                  d="M10 20C4.47715 20 0 15.5228 0 10C0 4.47715 4.47715 0 10 0C15.5228 0 20 4.47715 20 10C20 15.5228 15.5228 20 10 20ZM10 18C14.4183 18 18 14.4183 18 10C18 5.58172 14.4183 2 10 2C5.58172 2 2 5.58172 2 10C2 14.4183 5.58172 18 10 18ZM11 10H15V12H9V5H11V10Z"
                  fill="black"></path>
              </svg>
            </span>
            <span class="career-list-text">Full Time</span>
          </li>
          <li class="career-list">
            <span class="career-list-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="22" viewBox="0 0 18 22" fill="none">
                <path
                  d="M9 18.8995L13.9497 13.9497C16.6834 11.2161 16.6834 6.78392 13.9497 4.05025C11.2161 1.31658 6.78392 1.31658 4.05025 4.05025C1.31658 6.78392 1.31658 11.2161 4.05025 13.9497L9 18.8995ZM9 21.7279L2.63604 15.364C-0.87868 11.8492 -0.87868 6.15076 2.63604 2.63604C6.15076 -0.87868 11.8492 -0.87868 15.364 2.63604C18.8787 6.15076 18.8787 11.8492 15.364 15.364L9 21.7279ZM9 11C10.1046 11 11 10.1046 11 9C11 7.89543 10.1046 7 9 7C7.8954 7 7 7.89543 7 9C7 10.1046 7.8954 11 9 11ZM9 13C6.79086 13 5 11.2091 5 9C5 6.79086 6.79086 5 9 5C11.2091 5 13 6.79086 13 9C13 11.2091 11.2091 13 9 13Z"
                  fill="black"></path>
              </svg>
            </span>
            <span class="career-list-text">Remote</span>
          </li>
          <li class="career-list">
            <span class="career-list-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path
                  d="M18 10C18 5.58172 14.4183 2 10 2C5.58172 2 2 5.58172 2 10C2 14.4183 5.58172 18 10 18C14.4183 18 18 14.4183 18 10ZM20 10C20 15.5228 15.5228 20 10 20C4.47715 20 0 15.5228 0 10C0 4.47715 4.47715 0 10 0C15.5228 0 20 4.47715 20 10ZM11.5003 6C11.8278 6.43606 12.0625 6.94584 12.175 7.5H14V9H12.175C11.8275 10.7117 10.3142 12 8.5 12H8.3107L12.0303 15.7197L10.9697 16.7803L6 11.8107V10.5H8.5C9.4797 10.5 10.3131 9.8739 10.622 9H6V7.5H10.622C10.3131 6.62611 9.4797 6 8.5 6H6V4.5H14V6H11.5003Z"
                  fill="black"></path>
              </svg>
            </span>
            <span class="career-list-text">55k - 65k</span>
          </li>
        </ul>
      </div>
    </div>

    <!-- Popup -->
    <div id="popup" class="popup">
      <div class="popup-content">
        <span class="close">&times;</span>
        <section class="contact-section">
          <div class="contact-container">
            <h2>Send Us A Message</h2>
            <form class="contact-form">
              <label>Full Name *</label>
              <input type="text" placeholder="Enter full name" required>

              <label>Phone Number</label>
              <input type="tel" placeholder="Enter number">

              <label>Email *</label>
              <input type="email" placeholder="Enter email" required>

              <label>Message</label>
              <textarea placeholder="Leave a message....."></textarea>

              <div class="recaptcha">
                <input type="checkbox" id="robot">
                <label for="robot">I'm not a robot (reCAPTCHA will be integrated)</label>
              </div>

              <button type="submit" class="send-btn">Send Message</button>
            </form>
          </div>
        </section>
      </div>
    </div>
  </section>

  <script>
    const popup = document.getElementById("popup");
    const applyBtn = document.getElementById("applyBtn");
    const closeBtn = document.querySelector(".close");

    applyBtn.addEventListener("click", (e) => {
      e.preventDefault();
      popup.style.display = "flex";
    });

    closeBtn.addEventListener("click", () => {
      popup.style.display = "none";
    });

    window.addEventListener("click", (e) => {
      if (e.target === popup) popup.style.display = "none";
    });
  </script>
</body>

</html>
