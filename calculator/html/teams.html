<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dedicated Teams Calculator</title>
  <link rel="stylesheet" href="./css/style.css" />
  <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-50 min-h-screen p-8 font-sans">

  <div class="max-w-4xl mx-auto grid lg:grid-cols-2 gap-8">

    <!-- Input Form -->
    <div class="bg-white border rounded shadow p-6 space-y-6">
<h2 class="text-xl font-semibold">Team Requirements</h2>
<p class="text-sm text-gray-500">Tell us about your team needs</p>
      <!-- Roles Selection -->
      <div>
        <label class="font-medium text-gray-700 mb-2 block">Required Roles</label>
        <div class="grid grid-cols-2 gap-2" id="roles-container">
          <!-- Roles checkboxes injected by JS -->
        </div>
      </div>

      <!-- Seniority Level -->
      <div>
        <label class="font-medium text-gray-700 mb-1 block">Seniority Level</label>
        <select id="seniority" class="w-full border rounded px-2 py-1">
          <option value="junior">Junior (1-3 years)</option>
          <option value="mid" selected>Mid-level (3-6 years)</option>
          <option value="senior">Senior (6+ years)</option>
        </select>
      </div>

      <!-- Team Size -->
      <div>
        <label class="font-medium text-gray-700 mb-1 block">Team Size (FTEs)</label>
        <input type="number" id="fteCount" min="1" max="20" value="3" class="w-full border rounded px-2 py-1">
      </div>

      <!-- Duration -->
      <div>
        <label class="font-medium text-gray-700 mb-1 block">Duration (months)</label>
        <input type="number" id="duration" min="1" max="36" value="6" class="w-full border rounded px-2 py-1">
      </div>

      <!-- Location & Billing -->
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="font-medium text-gray-700 mb-1 block">Location</label>
          <select id="location" class="w-full border rounded px-2 py-1">
            <option value="india" selected>India</option>
            <option value="eastern_europe">Eastern Europe</option>
            <option value="latin_america">Latin America</option>
          </select>
        </div>
        <div>
          <label class="font-medium text-gray-700 mb-1 block">Billing Model</label>
          <select id="billing" class="w-full border rounded px-2 py-1">
            <option value="monthly" selected>Monthly</option>
            <option value="quarterly">Quarterly</option>
            <option value="yearly">Annual</option>
          </select>
        </div>
      </div>

      <!-- Time Zone Overlap -->
      <div>
        <label class="font-medium text-gray-700 mb-1 block">Required Time Zone Overlap</label>
        <select id="tzOverlap" class="w-full border rounded px-2 py-1">
          <option value="no_overlap">No specific overlap needed</option>
          <option value="partial_overlap" selected>Partial overlap (4+ hours)</option>
          <option value="full_overlap">Full overlap (8+ hours)</option>
        </select>
      </div>

      <!-- Certifications -->
      <div>
        <label class="font-medium text-gray-700 mb-2 block">Required Certifications</label>
        <div class="grid grid-cols-2 gap-2" id="certifications-container">
          <!-- Certification checkboxes injected by JS -->
        </div>
      </div>

      <button id="calculateBtn" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
        Calculate Team Costs
      </button>

    </div>

    <!-- Results Preview -->
    <div id="results" class="bg-white border rounded shadow p-6 space-y-4 hidden">
  <div class="pb-4 mb-4">
  <h3 class="text-slate-900 flex items-center gap-2 text-lg font-semibold">
    <!-- Dollar Sign Icon -->
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <line x1="12" y1="1" x2="12" y2="23"></line>
      <path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"></path>
    </svg>
    Cost Estimate (Preview)
  </h3>
  <p class="text-sm text-slate-600 mt-1">
    Blurred preview – submit details for full breakdown
  </p>
</div>
<div class="text-center bg-blue-50 p-6 rounded-lg relative z-0">
  <div class="absolute inset-0 bg-background/60 backdrop-blur-[2px] z-10"></div>
      <div id="monthlyEstimate" class="text-3xl font-bold text-center"></div>
      <div id="projectCost" class="text-lg text-center text-gray-600"></div>
      <div id="blendedRate" class="text-sm text-center text-gray-500"></div>
</div>
      <div class="space-y-4">
        <div class="flex justify-between items-center p-3 bg-gray-200 rounded" id="team-size">
          <span class="text-sm text-gray-600">Team Size:</span>
          <span class="font-medium" id="team-size-value">0 FTEs</span>
        </div>
        <div class="flex justify-between items-center p-3 bg-gray-200 rounded" id="duration">
          <span class="text-sm text-gray-600">Duration:</span>
          <span class="font-medium" id="duration-value">0 months</span>
        </div>
        <div class="flex justify-between items-center p-3 bg-gray-200 rounded">
          <span class="text-sm text-gray-600">Start ETA:</span>
          <span class="font-medium">2-3 weeks</span>
        </div>
      </div>
      <button id="openModalBtn"
        class="w-full bg-blue-800 text-white px-4 py-3 rounded-lg text-lg hover:bg-blue-700 transition">
        Get Full Team Breakdown
      </button>


      <!-- Modal -->
      <div id="leadModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg w-full max-w-md p-6 relative">
          <!-- Close Button -->
          <button id="closeModalBtn" class="absolute top-3 right-3 text-gray-500 hover:text-gray-800">&times;</button>

          <!-- Header -->
          <h2 class="text-xl font-semibold mb-2">Almost there—get your detailed estimate</h2>
          <p class="text-gray-600 text-sm mb-4">We'll show the full breakdown and email you a shareable PDF.</p>

          <!-- Form -->
          <div class="space-y-4">
            <div class="space-y-2">
              <label for="lead-name" class="text-sm font-medium">Name</label>
              <input id="lead-name" type="text" placeholder="Your full name"
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <div class="space-y-2">
              <label for="lead-email" class="text-sm font-medium">Work Email</label>
              <input id="lead-email" type="email" placeholder="you@company.com"
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <div class="flex items-center space-x-2">
              <input id="consent" type="checkbox" class="w-4 h-4" />
              <label for="consent" class="text-sm text-gray-600">
                I agree to receive the estimate and related communications
              </label>
            </div>

            <button id="submitLeadBtn"
              class="w-full bg-blue-800 text-white px-4 py-3 rounded-lg text-lg hover:bg-blue-700 transition">
              Reserve This Team
            </button>
          </div>
        </div>
      </div>

    </div>

  </div>
  <script src="./js/teams.js"></script>
</body>

</html>
