<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dedicated Teams Calculator</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <div class="calculator-container">
    <!-- Input Form -->
    <div class="card">
      <h2>Team Requirements</h2>
      <p class="muted">Tell us about your team needs</p>

      <!-- Roles Selection -->
      <div class="form-group">
        <label>Required Roles</label>
        <div id="roles-container" class="grid-2"></div>
      </div>

      <!-- Seniority Level -->
      <div class="form-group">
        <label>Seniority Level</label>
        <select id="seniority">
          <option value="junior">Junior (1-3 years)</option>
          <option value="mid" selected>Mid-level (3-6 years)</option>
          <option value="senior">Senior (6+ years)</option>
        </select>
      </div>

      <!-- Team Size -->
      <div class="form-group">
        <label>Team Size (FTEs)</label>
        <input type="number" id="fteCount" min="1" max="20" value="3">
      </div>

      <!-- Duration -->
      <div class="form-group">
        <label>Duration (months)</label>
        <input type="number" id="duration" min="1" max="36" value="6">
      </div>

      <!-- Location & Billing -->
      <div class="grid-2">
        <div class="form-group">
          <label>Location</label>
          <select id="location">
            <option value="india" selected>India</option>
            <option value="eastern_europe">Eastern Europe</option>
            <option value="latin_america">Latin America</option>
          </select>
        </div>
        <div class="form-group">
          <label>Billing Model</label>
          <select id="billing">
            <option value="monthly" selected>Monthly</option>
            <option value="quarterly">Quarterly</option>
            <option value="yearly">Annual</option>
          </select>
        </div>
      </div>

      <!-- Time Zone Overlap -->
      <div class="form-group">
        <label>Required Time Zone Overlap</label>
        <select id="tzOverlap">
          <option value="no_overlap">No specific overlap needed</option>
          <option value="partial_overlap" selected>Partial overlap (4+ hours)</option>
          <option value="full_overlap">Full overlap (8+ hours)</option>
        </select>
      </div>

      <!-- Certifications -->
      <div class="form-group">
        <label>Required Certifications</label>
        <div id="certifications-container" class="grid-2"></div>
      </div>

      <button id="calculateBtn" class="btn-primary">Calculate Team Costs</button>
    </div>

    <!-- Results Preview -->
    <div id="results" class="calculator-modal modal hidden">
      <div class="modal-overlay"></div>
        <div class="modal-content">
    <button id="closeResultsBtn" class="modal-close">&times;</button>
      <div class="section-header">
        <h3>Cost Estimate (Preview)</h3>
        <p class="muted">Blurred preview – submit details for full breakdown</p>
      </div>

      <div class="blur-box">
        <div id="monthlyEstimate" class="big-text"></div>
        <div id="projectCost" class="medium-text"></div>
        <div id="blendedRate" class="small-text"></div>
      </div>

      <div class="info-list">
        <div class="info-item">
          <span>Team Size:</span>
          <span id="team-size-value">0 FTEs</span>
        </div>
        <div class="info-item">
          <span>Duration:</span>
          <span id="duration-value">0 months</span>
        </div>
        <div class="info-item">
          <span>Start ETA:</span>
          <span>2-3 weeks</span>
        </div>
      </div>

      <button id="openModalBtn" class="btn-secondary mt-2">Get Full Team Breakdown</button>


    </div>
  </div>
  </div>
        <!-- Modal -->
      <div id="leadModal" class="calculator-modal modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content">
          <button id="closeModalBtn" class="modal-close">&times;</button>
          <h2>Almost there—get your detailed estimate</h2>
          <p class="muted">We'll show the full breakdown and email you a shareable PDF.</p>

          <div class="form-group">
            <label for="lead-name">Name</label>
            <input id="lead-name" type="text" placeholder="Your full name">
          </div>

          <div class="form-group">
            <label for="lead-email">Work Email</label>
            <input id="lead-email" type="email" placeholder="you@company.com">
          </div>

          <div class="form-check">
            <input id="consent" type="checkbox">
            <label for="consent">I agree to receive the estimate and related communications</label>
          </div>

          <button id="submitLeadBtn" class="btn-secondary mt-2">Reserve This Team</button>
        </div>
      </div>
  <script src="./js/teams.js"></script>
</body>
</html>
