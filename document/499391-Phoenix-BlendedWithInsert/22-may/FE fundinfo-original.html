    <script type="text/javascript">
        var loginError = 'Token invalid.';
        $(document).ready(function () {

            function filterStylesLogos() {
                $('#Styles option').each(function () {
                    $(this).attr('data-theme') == undefined || $(this).attr('data-theme').toLocaleLowerCase() == $('#Theme').val().toLocaleLowerCase()
                        ? $(this).show()
                        : $(this).hide();
                });
                $('#Logos option').each(function () {
                    $(this).attr('data-theme') == undefined || $(this).attr('data-theme').toLocaleLowerCase() == $('#Theme').val().toLocaleLowerCase()
                        ? $(this).show()
                        : $(this).hide();
                });
            }

            function generate(templateType) {
                $('.error').text('').hide();
                $('.warnings').html('');
                var citicode = $('#CitiCode').val().trim();
                var calculationid = $('#calculationid').val().trim();
                if (calculationid == '' && citicode == '') {
                    $('.error').text('Please enter a CitiCode or calculationid').show();
                   return;
                }
                var dateValue = parseInt($('#DocumentDate').val());
                var year = dateValue % 100;
                var month = (dateValue - year) / 100;
                var docDate = new Date();
                docDate.setMonth(month - 1);
                docDate.setFullYear(2000 + year);
                docDate.setDate(1);

                // Adjust date to last day of month
                docDate.setMonth(docDate.getMonth() + 1);
                docDate.setDate(docDate.getDate() - 1);

                var clientFields = [];
                $('.clientField').each(function () {
                    if ($(this).val().trim() != '')
                        clientFields.push({
                            DataName: $(this).attr('name'),
                            Value: $(this).val()
                        });
                });

                $('iframe').hide();

                ajaxRequest({
                    url: './GeneratePreview',
                    contentType: "application/json; charset=utf-8",
                    data: JSON.stringify({
                        templateType: templateType,
                        templateId: $('#TemplateId').val(),
                        citicode: citicode,
                        calculationid: calculationid,
                        locale: $('#Locale').val(),
                        documentDate: docDate.toJSON().substring(0, 10),
                        theme: $('#Theme').val(),
                        styleId: $('#Styles').val(),
                        clientFields: clientFields,
                        logoId: $('#Logos').val(),
                        secondaryUnitCiticodes: $('#SecondaryUnitCiticodes').val(),
                        secondaryBenchmark: $('#SecondaryBenchmark').val(),
                        targetBenchmark: $('#TargetBenchmark').val(),
                        comparatorBenchmark: $('#ComparatorBenchmark').val(),
                        constraintBenchmark: $('#ConstraintBenchmark').val(),
                        additionalUnitBenchmark: $('#AdditionalUnitBenchmark').val(),
                        addtionalUnitSector: $('#AdditionalUnitSector').val()
                    }),
                    success: function (result) {
                        console.log(result);
                        if (result.error != null) {
                            $('.error').text(result.error).show();
                        } else {
                            if (result.warnings.length > 0) {
                                result.warnings.forEach(function (warning) {
                                    $('.warnings').append('<li>' + warning + '</li>');
                                });
                                $("#close").click(function () {
                                    $(".info").hide();
                                });
                                $(".info").show();
                            }
                            $('iframe').show().attr('src', result.path);
                        }
                    },
                    error: function (xhr) {
                        $('.error').text(xhr).show();
                    }
                });
            }

            filterStylesLogos();
            $('#Theme').on('change', function () {
                filterStylesLogos();
            });
            $('#previewPdf').on('click', function (e) {
                e.preventDefault();
                generate(1);
            });
            $('#previewHtml').on('click', function (e) {
                e.preventDefault();
                generate(2);
            });

        });
    </script>
